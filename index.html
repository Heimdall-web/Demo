<!DOCTYPE html>
<html>
<head>
  <meta name="google-site-verification" content="JL0DhmvkXbV8ONTHyHKYCFZVC_XAcwcof0fZR-tbgPQ" />
  <title>Embedded Content</title>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyF5xsm2VFjJYDNEor3NbDg8iH5U5Is50pF3XAA49hWoKpntuWKvud_DCqjaRXRS1I/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
